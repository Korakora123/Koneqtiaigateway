# NEW nginx file for the AI gateway — does not touch any existing CloudPanel/site config.
#
#   sudo cp ops/nginx/koneqti-ai-gateway.conf /etc/nginx/sites-enabled/koneqti-ai-gateway.conf
#   (edit server_name, certificate paths and the allow list first)
#   sudo nginx -t && sudo systemctl reload nginx        # never restart nginx
#
# Only Koneqti servers may connect (allow/deny) AND each request needs a product key.

server {
    listen 8443 ssl;                     # separate port: no clash with CloudPanel sites on 443
    listen [::]:8443 ssl;
    http2 on;
    server_name ai.example.com;          # <-- your AI gateway hostname

    ssl_certificate     /etc/nginx/ssl-certificates/ai.example.com.crt;   # <-- adjust
    ssl_certificate_key /etc/nginx/ssl-certificates/ai.example.com.key;   # <-- adjust

    # --- IP allowlist: Koneqti servers only ---
    allow 203.0.113.10;                  # <-- Windows VPS (brains/workers) public IP
    deny  all;

    access_log off;                      # gateway logs metadata itself; never log bodies here
    client_max_body_size 26m;            # voice notes up to 25 MB
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append (no spoofing)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;             # streaming chat (SSE)
        proxy_request_buffering on;
        proxy_read_timeout 1900s;        # batch jobs may wait for the off-peak window
        proxy_send_timeout 120s;
    }
}
